services:
  backend:
    build:
      context: .
    image: aqip-backend:local
    container_name: aqip-backend-DC
    environment:
      PORT: 3000
      LOG_LEVEL: info
      SWAGGER_ENABLED: true
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5433/aqip?schema=public
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: aqip-postgres
    environment:
      POSTGRES_DB: aqip
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - aqip-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d aqip']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  aqip-postgres-data:
